<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../ui/common.css" />
    <style>
      body { width: 320px; }
      header { display: flex; gap: 10px; align-items: center; padding: 14px; }
      .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
      .dot.recording { background: var(--red); }
      .dot.alert { background: var(--amber); }
      #status { flex: 1; margin: 0; }
      .language { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 0; padding: 0 14px 12px; }
      .language .button { flex: none; padding: 4px 10px; font-size: 12px; }
      #settings { flex: none; padding: 2px 6px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 16px; line-height: 1; }
      #settings:hover { background: var(--panel); color: var(--text); }
      .section { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 14px 4px; border-top: 1px solid var(--border); }
      h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
      .link { padding: 0; border: 0; background: none; color: var(--accent); font-size: 12px; text-decoration: none; }
      .link:hover { text-decoration: underline; }
      ul { list-style: none; margin: 0; padding: 0 6px 8px; }
      li { display: flex; gap: 6px; align-items: center; }
      .open { flex: 1; min-width: 0; padding: 7px 8px; border: 0; border-radius: 8px; background: none; text-align: left; }
      .open:hover { background: var(--panel); }
      .open strong, .open span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .open strong { font-weight: 600; }
      li .button { flex: none; padding: 4px 10px; font-size: 12px; }
      #empty { margin: 0; padding: 4px 14px 10px; }
      .report { display: flex; gap: 10px; align-items: baseline; margin: 0; padding: 8px 14px; border-top: 1px solid var(--border); }
      .report span { flex: 1; color: var(--amber); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <p id="status" role="status" data-i18n="statusIdle"></p>
      <button class="button primary" id="action" hidden></button>
      <button id="settings" data-i18n-aria-label="settings">⚙</button>
    </header>
    <p class="language" id="language" hidden>
      <span><span data-i18n="captionsIn"></span> <strong id="languageName"></strong></span>
      <button class="button" id="changeLanguage" data-i18n="change"></button>
    </p>
    <div class="section">
      <h2 data-i18n="recent"></h2>
      <button class="link" id="viewAll" data-i18n="viewAll"></button>
    </div>
    <p class="muted" id="empty" data-i18n="emptyHistory" hidden></p>
    <ul id="recent"></ul>
    <p class="report" id="report" hidden>
      <span data-i18n="reportTitle"></span>
      <button class="link" id="copyOutline" data-i18n="reportCopy"></button>
      <a class="link" id="openIssue" target="_blank" rel="noopener" data-i18n="reportOpenIssue"></a>
    </p>
    <script src="../shared/constants.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/transcript.js"></script>
    <script src="../shared/history.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

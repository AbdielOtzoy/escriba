<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Replaces the default theme's layout, which loads a script from a CDN. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; font-src 'self'; style-src 'unsafe-inline'"
    />
    <meta name="color-scheme" content="dark" />
    <title>{{ page.title | default: 'Escriba' }}</title>
    {% if page.description %}<meta name="description" content="{{ page.description | escape }}" />{% endif %}
    <link rel="icon" href="{{ '/icon.svg' | relative_url }}" type="image/svg+xml" />
    <style>
      /* Newsreader, by Production Type, SIL Open Font License 1.1 (fonts/OFL.txt). */
      @font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 200 800; font-display: swap; src: url({{ '/fonts/newsreader.woff2' | relative_url }}) format('woff2'); }
      @font-face { font-family: 'Newsreader'; font-style: italic; font-weight: 200 800; font-display: swap; src: url({{ '/fonts/newsreader-italic.woff2' | relative_url }}) format('woff2'); }
      :root {
        --bg: #0b1631;
        --panel: rgba(255, 255, 255, 0.06);
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.72);
        --border: rgba(255, 255, 255, 0.14);
        --accent: #ffb547;
        --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background:
          radial-gradient(1100px 700px at 88% -8%, rgba(255, 181, 71, 0.14), rgba(255, 181, 71, 0) 65%),
          linear-gradient(180deg, #13224a 0%, var(--bg) 22%, #050a19 60%, #020409 100%);
        background-color: #020409;
      }
      body { color: var(--text); font: 17px/1.65 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      header, main, footer { max-width: 46rem; margin: 0 auto; padding: 0 20px; }
      header { padding-top: 24px; }
      header svg { width: 28px; height: 27px; }
      header a { display: inline-flex; gap: 10px; align-items: center; color: var(--text); font: 500 1.5rem/1 var(--serif); text-decoration: none; }
      a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
      a:hover { color: var(--text); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
      h1, h2, h3 { line-height: 1.2; }
      h1, h2 { font-family: var(--serif); font-weight: 400; letter-spacing: -0.015em; }
      h1 { font-size: clamp(2.2rem, 6vw, 3rem); margin: 48px 0 24px; }
      h2 { font-size: 1.8rem; margin-top: 2em; }
      img { max-width: 100%; height: auto; }
      code { font: 0.9em ui-monospace, 'SF Mono', Menlo, Consolas, monospace; padding: 1px 5px; background: var(--panel); border-radius: 5px; }
      pre { padding: 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
      pre code { padding: 0; background: none; }
      blockquote { margin: 0; padding-left: 16px; border-left: 3px solid var(--border); color: var(--muted); }
      table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
      th, td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; vertical-align: top; }
      th { background: var(--panel); }
      footer { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 48px; padding-top: 24px; padding-bottom: 40px; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.9rem; }
      footer a { color: var(--muted); }
      @media (max-width: 400px) {
        body { font-size: 16px; }
        header, main, footer { padding-left: 16px; padding-right: 16px; }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="{{ '/' | relative_url }}">
        <svg viewBox="20 24 88 84" aria-hidden="true">
          <mask id="lines">
            <rect x="20" y="24" width="88" height="84" fill="#fff" />
            <rect x="38" y="42" width="52" height="7" rx="3.5" fill="#000" />
            <rect x="38" y="54" width="52" height="7" rx="3.5" fill="#000" />
            <rect x="38" y="66" width="30" height="7" rx="3.5" fill="#000" />
          </mask>
          <g fill="#fff" mask="url(#lines)">
            <rect x="22" y="26" width="84" height="62" rx="16" />
            <path d="M38 84L32 106L60 86Z" />
          </g>
        </svg>
        Escriba
      </a>
    </header>
    <main>
      {% unless content contains '<h1' %}<h1>{{ page.title }}</h1>{% endunless %}
      {{ content }}
    </main>
    <footer>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="https://github.com/AbdielOtzoy/escriba">GitHub</a>
      <a href="{{ '/privacy' | relative_url }}">Privacy policy</a>
    </footer>
  </body>
</html>

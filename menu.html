<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="comun.css" />
    <style>
      body { width: 320px; }
      header { display: flex; gap: 10px; align-items: center; padding: 14px; }
      .punto { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--tenue); }
      .punto.grabando { background: var(--rojo); }
      .punto.alerta { background: var(--ambar); }
      #estado { flex: 1; margin: 0; }
      h2 { margin: 0; padding: 10px 14px 4px; border-top: 1px solid var(--borde); font-size: 11px;
           font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--tenue); }
      ul { list-style: none; margin: 0; padding: 0 6px; }
      li { display: flex; gap: 6px; align-items: center; }
      .abrir { flex: 1; min-width: 0; padding: 7px 8px; border: 0; border-radius: 8px; background: none; text-align: left; }
      .abrir:hover { background: var(--panel); }
      .abrir strong, .abrir span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .abrir strong { font-weight: 600; }
      li .boton { flex: none; padding: 4px 10px; font-size: 12px; }
      #vacio { margin: 0; padding: 4px 14px 8px; }
      .idioma { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 0; padding: 0 14px 12px; }
      .idioma .boton { flex: none; padding: 4px 10px; font-size: 12px; }
      .todas { padding: 10px 14px 14px; }
      .todas .boton { width: 100%; }
      .ajuste { display: flex; gap: 8px; align-items: flex-start; padding: 8px 14px; cursor: pointer; }
      .ajuste:last-of-type { padding-bottom: 14px; }
      .ajuste input { flex: none; margin: 2px 0 0; accent-color: var(--acento); }
    </style>
  </head>
  <body>
    <header>
      <span class="punto" id="punto"></span>
      <p id="estado" role="status">Sin reunión en esta pestaña</p>
      <button class="boton principal" id="pausa" hidden></button>
    </header>
    <p class="idioma" id="idioma" hidden>
      <span>Subtítulos en <strong id="idiomaNombre"></strong></span>
      <button class="boton" id="cambiarIdioma">Cambiar</button>
    </p>
    <h2>Recientes</h2>
    <p class="tenue" id="vacio" hidden>Todavía no hay transcripciones guardadas.</p>
    <ul id="recientes"></ul>
    <div class="todas"><button class="boton" id="todas">Ver todas las transcripciones</button></div>
    <h2>Ajustes</h2>
    <label class="ajuste">
      <input type="checkbox" id="auto" />
      <span>Transcribir automáticamente al entrar a una reunión</span>
    </label>
    <label class="ajuste">
      <input type="checkbox" id="detectar" />
      <span>Avisarme si el idioma de los subtítulos no es el de mi navegador</span>
    </label>
    <script src="logica.js"></script>
    <script src="menu.js"></script>
  </body>
</html>

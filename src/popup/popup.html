<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../ui/common.css" />
    <style>
      body { width: 320px; }
      header { display: flex; gap: 10px; align-items: center; padding: 14px; }
      .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
      .dot.recording { background: var(--red); }
      .dot.alert { background: var(--amber); }
      #status { flex: 1; margin: 0; }
      .language { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 0; padding: 0 14px 12px; }
      .language .button { flex: none; padding: 4px 10px; font-size: 12px; }
      h2 { margin: 0; padding: 10px 14px 4px; border-top: 1px solid var(--border); font-size: 11px;
           font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
      ul { list-style: none; margin: 0; padding: 0 6px; }
      li { display: flex; gap: 6px; align-items: center; }
      .open { flex: 1; min-width: 0; padding: 7px 8px; border: 0; border-radius: 8px; background: none; text-align: left; }
      .open:hover { background: var(--panel); }
      .open strong, .open span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .open strong { font-weight: 600; }
      li .button { flex: none; padding: 4px 10px; font-size: 12px; }
      #empty { margin: 0; padding: 4px 14px 8px; }
      .all { padding: 10px 14px 14px; }
      .all .button { width: 100%; }
      .setting { display: flex; gap: 8px; align-items: flex-start; padding: 8px 14px; cursor: pointer; }
      #reportHint { margin: 0; padding: 4px 14px 0; }
      .report { display: flex; gap: 8px; padding: 8px 14px 14px; }
      .report .button { flex: 1; padding: 4px 10px; font-size: 12px; text-align: center; text-decoration: none; color: inherit; }
      .setting input { flex: none; margin: 2px 0 0; accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <p id="status" role="status" data-i18n="statusIdle"></p>
      <button class="button primary" id="action" hidden></button>
    </header>
    <p class="language" id="language" hidden>
      <span><span data-i18n="captionsIn"></span> <strong id="languageName"></strong></span>
      <button class="button" id="changeLanguage" data-i18n="change"></button>
    </p>
    <h2 data-i18n="recent"></h2>
    <p class="muted" id="empty" data-i18n="emptyHistory" hidden></p>
    <ul id="recent"></ul>
    <div class="all"><button class="button" id="viewAll" data-i18n="viewAll"></button></div>
    <h2 data-i18n="settings"></h2>
    <label class="setting">
      <input type="checkbox" id="autoStart" />
      <span data-i18n="settingAutoStart"></span>
    </label>
    <label class="setting">
      <input type="checkbox" id="languageWarning" />
      <span data-i18n="settingLanguageWarning"></span>
    </label>
    <section id="report" hidden>
      <h2 data-i18n="reportTitle"></h2>
      <p class="muted" id="reportHint" data-i18n="reportHint"></p>
      <div class="report">
        <button class="button" id="copyOutline" data-i18n="reportCopy"></button>
        <a class="button" id="openIssue" target="_blank" rel="noopener" data-i18n="reportOpenIssue"></a>
      </div>
    </section>
    <script src="../shared/constants.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/transcript.js"></script>
    <script src="../shared/history.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Escriba · Transcripciones</title>
    <link rel="stylesheet" href="comun.css" />
    <style>
      body { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
      nav { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--borde); background: var(--panel); }
      nav h1 { margin: 0; padding: 18px 16px 10px; font-size: 17px; }
      #buscar { margin: 0 12px 10px; padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px;
                background: var(--fondo); color: inherit; font: inherit; }
      #lista { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0 8px 12px; }
      #lista button { display: block; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: none; text-align: left; }
      #lista button:hover { background: color-mix(in srgb, var(--texto) 7%, transparent); }
      #lista button[aria-current='true'] { background: color-mix(in srgb, var(--acento) 18%, transparent); }
      #lista strong, #lista span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .aviso { margin: 0; padding: 8px 18px; }
      main { overflow-y: auto; padding: 28px 32px 48px; }
      article { max-width: 760px; margin: 0 auto; }
      article h2 { margin: 0 0 4px; font-size: 24px; line-height: 1.25; overflow-wrap: anywhere; }
      .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 24px; padding-bottom: 20px; border-bottom: 1px solid var(--borde); }
      .acciones .peligro { margin-left: auto; color: var(--rojo); }
      .turno { margin: 0 0 18px; }
      .turno header { display: flex; gap: 8px; align-items: baseline; }
      .nombre { font-weight: 650; color: hsl(var(--tono) 60% var(--nombre-l)); }
      .turno p { margin: 2px 0 6px; font-size: 15px; line-height: 1.55; overflow-wrap: anywhere; }
      @media (max-width: 760px) {
        body { display: block; height: auto; }
        nav { border-right: 0; border-bottom: 1px solid var(--borde); }
        #lista { max-height: 40vh; }
        main { padding: 20px 16px 40px; }
      }
    </style>
  </head>
  <body>
    <nav aria-label="Reuniones">
      <h1>Escriba · Transcripciones</h1>
      <input id="buscar" type="search" placeholder="Buscar por título, persona o texto" aria-label="Buscar transcripciones" />
      <p class="aviso tenue" id="aviso" hidden></p>
      <ul id="lista"></ul>
    </nav>
    <main><article id="detalle"></article></main>
    <script src="logica.js"></script>
    <script src="historial.js"></script>
  </body>
</html>
